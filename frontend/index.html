<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AceaPerú - Login Corporativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/login.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="background-overlay"></div>
  
  <div class="main-container">
    <div class="login-card">
      <div class="header">
        <div class="logo-container">
          <img src="/src/assets/logoaceaperu.png" alt="Logo AceaPerú" class="login-logo">
        </div>
        <h1>Sistema de Tickets</h1>
        <p>Gestión de incidencias y soporte técnico</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="username" placeholder="Tu usuario" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btnIngresar">
          <span>Iniciar Sesión</span>
          <div class="loader" id="loader"></div>
        </button>
      </form>
      
      <p id="error-msg"></p>
    </div>
    
    <footer class="footer">
      &copy; 2024 <strong>AceaPerú</strong> • División de Tecnología
    </footer>
  </div>

  <script type="module" src="/src/js/main.js"></script>
  <script>
    // Inicializar iconos de Lucide
    lucide.createIcons();
  </script>
</body>
</html>
